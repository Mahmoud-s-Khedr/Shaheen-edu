name: shaheen-edu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu_dev_password
      POSTGRES_DB: edu
    ports:
      - '5433:5432'
    volumes:
      - edu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edu -d edu']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - edu_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://edu:edu_dev_password@postgres:5432/edu?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10

  ai-question-import-worker:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://edu:edu_dev_password@postgres:5432/edu?schema=public
      REDIS_URL: redis://redis:6379
    command: sh -c 'pnpm prisma migrate deploy && node dist/worker'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  edu_postgres_data:
  edu_redis_data:

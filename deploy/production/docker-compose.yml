name: shaheen-edu-production

# Production Docker responsibilities are limited to the application, worker,
# Redis, and explicit one-off jobs. Nginx, TLS, and PostgreSQL are deliberately
# host-managed and are not Compose services.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:?set REDIS_MAXMEMORY in .env}
    command:
      - sh
      - -c
      - >-
        redis-server --appendonly yes --appendfsync everysec
        --save 900 1 --save 300 10 --save 60 10000
        --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    labels:
      com.shaheen.edu.service: redis
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: &bounded_logging
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    # Invoke only through release-with-backup.sh after the host PostgreSQL
    # backup automation has reported a successful, restorable backup.
    profiles: ['migration']
    build:
      context: ../..
      target: migration
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts: &host_postgres
      - 'host.docker.internal:host-gateway'
    restart: 'no'
    labels:
      com.shaheen.edu.service: migrate
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      redis:
        condition: service_healthy

  # Run this profile exactly once for a new database, with the explicit
  # acknowledgement and approved refund-policy values in the environment.
  bootstrap:
    profiles: ['bootstrap']
    build:
      context: ../..
      target: migration
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts: *host_postgres
    command: ['pnpm', 'prisma:seed']
    restart: 'no'
    labels:
      com.shaheen.edu.service: bootstrap
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUST_PROXY_HOPS: 1
      RELEASE_REVISION: ${RELEASE_REVISION:-unknown}
    extra_hosts: *host_postgres
    # Host Nginx is the sole public entry point. This port is intentionally
    # reachable only from the host loopback interface.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-13000}:3000'
    labels:
      com.shaheen.edu.service: api
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RELEASE_REVISION: ${RELEASE_REVISION:-unknown}
    extra_hosts: *host_postgres
    command: ['node', 'dist/worker']
    labels:
      com.shaheen.edu.service: worker
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  redis_data:

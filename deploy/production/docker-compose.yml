name: shaheen-edu-production

# Single-host production baseline. Keep PostgreSQL, Redis, the API, and the
# worker private to this Compose network; only nginx publishes 80/443.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      com.shaheen.edu.service: postgres
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: &bounded_logging
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:?set REDIS_MAXMEMORY in .env}
    command:
      - sh
      - -c
      - >-
        redis-server --appendonly yes --appendfsync everysec
        --save 900 1 --save 300 10 --save 60 10000
        --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    labels:
      com.shaheen.edu.service: redis
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    # Migrations must be invoked explicitly through release-with-backup.sh.
    # Keeping this out of the default profile prevents `docker compose up`
    # from applying schema changes without a remote-confirmed backup.
    profiles: ['migration']
    build:
      context: ../..
      target: migration
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    restart: 'no'
    labels:
      com.shaheen.edu.service: migrate
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      postgres:
        condition: service_healthy

  # This profile is deliberately separate from migrations. Run it only once
  # for a new database after setting the explicit bootstrap acknowledgement and
  # approved initial refund policy in the environment.
  bootstrap:
    profiles: ['bootstrap']
    build:
      context: ../..
      target: migration
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ['pnpm', 'prisma:seed']
    restart: 'no'
    labels:
      com.shaheen.edu.service: bootstrap
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
  api:
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUST_PROXY_HOPS: 1
      RELEASE_REVISION: ${RELEASE_REVISION:-unknown}
    labels:
      com.shaheen.edu.service: api
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RELEASE_REVISION: ${RELEASE_REVISION:-unknown}
    command: ['node', 'dist/worker']
    labels:
      com.shaheen.edu.service: worker
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    labels:
      com.shaheen.edu.service: nginx
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ['ops']
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    labels:
      com.shaheen.edu.service: certbot
      com.shaheen.edu.release: ${RELEASE_REVISION:-unknown}
    logging: *bounded_logging

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:

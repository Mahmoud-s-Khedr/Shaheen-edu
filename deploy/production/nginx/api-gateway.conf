# Internal Compose gateway. The public host Nginx owns TLS and proxies only to
# 127.0.0.1:${API_HOST_PORT}. Docker's embedded DNS returns every scaled `api`
# replica; resolving through a variable makes Nginx refresh that set at runtime.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;

    client_max_body_size 110m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_request_buffering off;
    }
}
